<button type="button" class="theme-toggle" aria-label="Switch color scheme">auto</button>
<script>
  (function () {
    var root = document.documentElement, btn = document.querySelector('.theme-toggle');
    var order = ['auto', 'light', 'dark'];
    function current() { return root.dataset.theme || 'auto'; }
    function apply(t) {
      if (t === 'auto') delete root.dataset.theme; else root.dataset.theme = t;
      btn.textContent = t;
      try { localStorage.setItem('theme', t); } catch (e) {}
    }
    btn.textContent = current();
    btn.addEventListener('click', function () {
      apply(order[(order.indexOf(current()) + 1) % order.length]);
    });
  })();
</script>
